<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evertec — Dashboard Facturación 2026</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f3; color: #1a1a18; padding: 2rem; }
h1 { font-size: 18px; font-weight: 500; margin-bottom: 1.5rem; color: #1a1a18; }
.metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
.card { background: #ebebea; border-radius: 8px; padding: 14px 16px; }
.card-label { font-size: 11px; color: #5f5e5a; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
.card-value { font-size: 24px; font-weight: 500; }
.card-sub { font-size: 11px; color: #5f5e5a; margin-top: 3px; }
.cv-green { color: #1D9E75; } .cv-amber { color: #BA7517; } .cv-blue { color: #378ADD; } .cv-primary { color: #1a1a18; }
.charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 1.5rem; }
.chart-box { background: #fff; border: 0.5px solid rgba(0,0,0,0.12); border-radius: 12px; padding: 14px 16px; }
.chart-title { font-size: 12px; font-weight: 500; color: #5f5e5a; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; font-size: 11px; color: #5f5e5a; }
.leg-sq { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 3px; vertical-align: middle; }
.filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
.fbtn { font-size: 11px; padding: 4px 10px; border-radius: 8px; border: 0.5px solid rgba(0,0,0,0.25); background: transparent; cursor: pointer; color: #5f5e5a; }
.fbtn.on { background: #e6f1fb; color: #185FA5; border-color: #378ADD; }
.table-wrap { background: #fff; border: 0.5px solid rgba(0,0,0,0.12); border-radius: 12px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
th { font-size: 10px; font-weight: 500; color: #5f5e5a; text-align: left; padding: 9px 12px; border-bottom: 0.5px solid rgba(0,0,0,0.1); background: #f5f5f3; text-transform: uppercase; letter-spacing: 0.04em; }
td { padding: 9px 12px; border-bottom: 0.5px solid rgba(0,0,0,0.08); color: #1a1a18; vertical-align: middle; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #f5f5f3; }
.pill { display: inline-block; font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 99px; }
.p-comp { background: #E1F5EE; color: #0F6E56; } .p-prog { background: #E6F1FB; color: #185FA5; }
.p-pend { background: #FAEEDA; color: #854F0B; } .p-apr { background: #EEEDFE; color: #3C3489; }
.p-no { background: #F1EFE8; color: #5F5E5A; }
.sec-label { font-size: 12px; font-weight: 500; color: #5f5e5a; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
@media (max-width: 700px) { .metrics { grid-template-columns: repeat(2,1fr); } .charts-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>Evertec — Dashboard Facturación 2026</h1>

<div class="metrics" id="metrics"></div>
<div class="charts-row">
  <div class="chart-box">
    <div class="chart-title">inversión por quarter ($)</div>
    <div class="legend" id="leg1"></div>
    <div style="position:relative;height:190px"><canvas id="c1"></canvas></div>
  </div>
  <div class="chart-box">
    <div class="chart-title">eventos por estatus</div>
    <div class="legend" id="leg2"></div>
    <div style="position:relative;height:190px"><canvas id="c2"></canvas></div>
  </div>
</div>
<div class="charts-row">
  <div class="chart-box">
    <div class="chart-title">eventos por categoría</div>
    <div style="position:relative;height:200px"><canvas id="c3"></canvas></div>
  </div>
  <div class="chart-box">
    <div class="chart-title">inversión por departamento ($)</div>
    <div style="position:relative;height:200px"><canvas id="c4"></canvas></div>
  </div>
</div>

<div class="sec-label">detalle de eventos</div>
<div class="filter-bar" id="filters"></div>
<div class="table-wrap">
  <table>
    <thead><tr>
      <th style="width:6%">Q</th>
      <th style="width:10%">Fecha</th>
      <th style="width:32%">Evento</th>
      <th style="width:16%">Categoría</th>
      <th style="width:10%">Inversión</th>
      <th style="width:14%">Departamento</th>
      <th style="width:12%">Estado</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const events = [
  {q:"Q1",fecha:"18 ene",ev:"Culturarte - Nadine Sierra",dep:"Business Solutions",cat:"Philanthropy / Foundations",est:"Completado",inv:6000},
  {q:"Q1",fecha:"7 feb",ev:"Gala Fundación MMM",dep:"Business Solutions",cat:"Philanthropy / Foundations",est:"Completado",inv:10000},
  {q:"Q1",fecha:"18 feb",ev:"22nd Trade & Learn Mech Show",dep:"Business Solutions",cat:"Corporate / Industry Events",est:"Completado",inv:1000},
  {q:"Q1",fecha:"26 feb",ev:"Torneo Invitacional Claro / Fundación Carlos Beltrán",dep:"Evertec & MAB",cat:"Golf Tournament",est:"Completado",inv:15000},
  {q:"Q1",fecha:"26 feb",ev:"Actividad Popular Insurance @ Humacao",dep:"Evertec & MAB",cat:"Corporate / Industry Events",est:"Completado",inv:0},
  {q:"Q1",fecha:"26 feb",ev:"Anti-Money Laundering Symposium",dep:"Business Solutions",cat:"Corporate / Industry Events",est:"Completado",inv:6000},
  {q:"Q1",fecha:"12 mar",ev:"Banking Tech Summit RD",dep:"Business Solutions",cat:"Corporate / Industry Events",est:"Completado",inv:2400},
  {q:"Q1",fecha:"13 mar",ev:"Make a Wish Golf Tournament",dep:"Business Solutions",cat:"Golf Tournament",est:"Completado",inv:3000},
  {q:"Q1",fecha:"14 mar",ev:"2026 Fiesta Gala: Celebrating PR",dep:"Business Solutions",cat:"Philanthropy / Foundations",est:"Completado",inv:15000},
  {q:"Q1",fecha:"19 mar",ev:"Fortinet & Evertec collab event",dep:"Business Solutions",cat:"Corporate / Industry Events",est:"Completado",inv:0},
  {q:"Q1",fecha:"25 mar",ev:"Gala Hogar Niñas Cupey",dep:"Business Solutions",cat:"Philanthropy / Foundations",est:"Completado",inv:6000},
  {q:"Q1",fecha:"25 mar",ev:"Actividad Popular Insurance @ Isabella",dep:"Evertec & MAB",cat:"Corporate / Industry Events",est:"Completado",inv:0},
  {q:"Q1",fecha:"27 mar",ev:"Convención Coop @ Ponce Hilton",dep:"Business Solutions",cat:"Corporate / Industry Events",est:"Completado",inv:1600},
  {q:"Q1",fecha:"28 mar",ev:"Pink Gala @ Fairmont El San Juan",dep:"Business Solutions",cat:"Philanthropy / Foundations",est:"Completado",inv:4000},
  {q:"Q1",fecha:"29 mar",ev:"5K en Familia - Hospital del Niño",dep:"Business Solutions",cat:"Philanthropy / Foundations",est:"Completado",inv:750},
  {q:"Q2",fecha:"11 abr",ev:"Gala 2026 Blank Canvas",dep:"Business Solutions",cat:"Philanthropy / Foundations",est:"Completado",inv:7500},
  {q:"Q2",fecha:"18 abr",ev:"Coffe & Chocolate Expo",dep:"Evertec & MAB",cat:"Corporate / Industry Events",est:"Completado",inv:0},
  {q:"Q2",fecha:"18 abr",ev:"Culturarte - Romeo & Juliet",dep:"Business Solutions",cat:"Philanthropy / Foundations",est:"En progreso",inv:6000},
  {q:"Q2",fecha:"22 abr",ev:"Endeavor Miami Summit",dep:"Oficina del Presidente",cat:"Corporate / Industry Events",est:"En progreso",inv:25000},
  {q:"Q2",fecha:"23 abr",ev:"Actividad Popular Insurance @ San Juan",dep:"Evertec & MAB",cat:"Corporate / Industry Events",est:"En progreso",inv:0},
  {q:"Q2",fecha:"29 abr",ev:"Golf - Mays Ochoa",dep:"Business Solutions",cat:"Golf Tournament",est:"En progreso",inv:1000},
  {q:"Q2",fecha:"30 abr",ev:"CIO & IT Leadership Conference",dep:"Business Solutions",cat:"Corporate / Industry Events",est:"En progreso",inv:5000},
  {q:"Q2",fecha:"6 may",ev:"Lunch and Learn - Acumatica",dep:"Business Solutions",cat:"Internal Events",est:"En progreso",inv:2500},
  {q:"Q2",fecha:"1 may",ev:"Gran Copa Gobernadora 2026",dep:"Evertec & MAB",cat:"Corporate / Industry Events",est:"En progreso",inv:500},
  {q:"Q2",fecha:"1 may",ev:"F1 Miami",dep:"Oficina del Presidente",cat:"Customer Relations",est:"En progreso",inv:354000},
  {q:"Q2",fecha:"11 may",ev:"Actividad Popular Insurance @ Plaza Dorada",dep:"Evertec & MAB",cat:"Corporate / Industry Events",est:"En progreso",inv:0},
  {q:"Q2",fecha:"13 may",ev:"SME @ Centro de Convenciones",dep:"Business Solutions",cat:"Corporate / Industry Events",est:"En progreso",inv:5000},
  {q:"Q2",fecha:"13 may",ev:"Acumatica - Almuerzo Econo",dep:"Business Solutions",cat:"Corporate / Industry Events",est:"En progreso",inv:3000},
  {q:"Q2",fecha:"15 may",ev:"Concierto Ed Sheeran - Coliseo",dep:"Business Solutions",cat:"Customer Relations",est:"En progreso",inv:0},
  {q:"Q2",fecha:"16 may",ev:"Golf Empleados Popular",dep:"Business Solutions",cat:"Golf Tournament",est:"En progreso",inv:10000},
  {q:"Q2",fecha:"28 may",ev:"El Museo del Barrio Gala",dep:"Oficina del Presidente",cat:"Philanthropy / Foundations",est:"En progreso",inv:25000},
  {q:"Q2",fecha:"28 may",ev:"PR Compra Expo Suplidores de Gobierno",dep:"Business Solutions",cat:"Corporate / Industry Events",est:"En progreso",inv:3980},
  {q:"Q2",fecha:"4 jun",ev:"Subway & Wing Stop Golf Classic",dep:"Evertec & MAB",cat:"Golf Tournament",est:"Por Aprobar",inv:2500},
  {q:"Q2",fecha:"5 jun",ev:"St. Jude Golf Tournament",dep:"Business Solutions",cat:"Golf Tournament",est:"No participamos",inv:0},
  {q:"Q2",fecha:"25 jun",ev:"MIDA Conference & Food Show 2026",dep:"Evertec & MAB",cat:"Corporate / Industry Events",est:"En progreso",inv:4500},
  {q:"Q2",fecha:"TBD",ev:"Innov8 RD",dep:"Business Solutions",cat:"Proprietary Event",est:"Pendiente",inv:0},
  {q:"Q2",fecha:"TBD",ev:"E-Commerce Growth Caribbean Conf.",dep:"Sin departamento",cat:"Corporate / Industry Events",est:"Pendiente",inv:0},
  {q:"Q2",fecha:"TBD",ev:"33rd FIRM Golf Classic",dep:"Business Solutions",cat:"Golf Tournament",est:"No participamos",inv:0},
  {q:"Q2",fecha:"TBD",ev:"Para La Naturaleza - Evento Filantrópico",dep:"Business Solutions",cat:"Corporate / Industry Events",est:"Pendiente",inv:0},
  {q:"Q3",fecha:"1 jul",ev:"Encuentro Econo @ Hyatt Grand Reserve",dep:"Business Solutions",cat:"Corporate / Industry Events",est:"Pendiente",inv:6500},
  {q:"Q3",fecha:"7 ago",ev:"Torneo de Golf - MMM",dep:"Business Solutions",cat:"Golf Tournament",est:"En progreso",inv:10000},
  {q:"Q3",fecha:"8 ago",ev:"Culturarte - Freddie de Tommaso & Emily D'Angelo",dep:"Oficina del Presidente",cat:"Philanthropy / Foundations",est:"En progreso",inv:10000},
  {q:"Q3",fecha:"12 ago",ev:"22do Torneo Golf P.E.C.E.S. 2026",dep:"Business Solutions",cat:"Golf Tournament",est:"En progreso",inv:1500},
  {q:"Q3",fecha:"30 oct",ev:"Asore Food Show",dep:"Evertec & MAB",cat:"Corporate / Industry Events",est:"En progreso",inv:10000},
  {q:"Q1",fecha:"TBD",ev:"Torneo de Golf - Cooperativas de PR",dep:"Business Solutions",cat:"Golf Tournament",est:"No participamos",inv:0},
  {q:"Q4",fecha:"4 oct",ev:"School of Rock Broadway Show",dep:"Business Solutions",cat:"Art and Musics Events",est:"En progreso",inv:35000},
  {q:"Q4",fecha:"16 oct",ev:"Torneo Golf Triple SSS",dep:"Business Solutions",cat:"Golf Tournament",est:"En progreso",inv:5000},
];

const total=events.length;
const completado=events.filter(e=>e.est==="Completado").length;
const enProgreso=events.filter(e=>e.est==="En progreso").length;
const totalInv=events.reduce((s,e)=>s+e.inv,0);

const m=document.getElementById("metrics");
[
  {label:"Total eventos",val:total,cls:"cv-primary",sub:"en el tracker 2026"},
  {label:"Completados",val:completado,cls:"cv-green",sub:Math.round(completado/total*100)+"% del total"},
  {label:"En progreso",val:enProgreso,cls:"cv-blue",sub:"activos ahora"},
  {label:"Inversión total",val:"$"+totalInv.toLocaleString(),cls:"cv-amber",sub:"todos los quarters"},
].forEach(c=>{
  m.innerHTML+=`<div class="card"><div class="card-label">${c.label}</div><div class="card-value ${c.cls}">${c.val}</div><div class="card-sub">${c.sub}</div></div>`;
});

const qs=["Q1","Q2","Q3","Q4"];
const qInv=qs.map(q=>events.filter(e=>e.q===q).reduce((s,e)=>s+e.inv,0));
const clrs1=["#1D9E75","#378ADD","#EF9F27","#D85A30"];
document.getElementById("leg1").innerHTML=qs.map((q,i)=>`<span style="display:flex;align-items:center;gap:3px"><span class="leg-sq" style="background:${clrs1[i]}"></span>${q}: $${qInv[i].toLocaleString()}</span>`).join("");
new Chart(document.getElementById("c1"),{type:"bar",data:{labels:qs,datasets:[{data:qInv,backgroundColor:clrs1,borderRadius:4,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{size:11},color:"#888780"}},y:{grid:{color:"rgba(136,135,128,0.15)"},ticks:{font:{size:10},color:"#888780",callback:v=>"$"+v.toLocaleString()}}}}});

const estados=["Completado","En progreso","Pendiente","Por Aprobar","No participamos"];
const eColors=["#1D9E75","#378ADD","#EF9F27","#7F77DD","#B4B2A9"];
const eCounts=estados.map(e=>events.filter(ev=>ev.est===e).length);
document.getElementById("leg2").innerHTML=estados.map((e,i)=>`<span style="display:flex;align-items:center;gap:3px"><span class="leg-sq" style="background:${eColors[i]}"></span>${e} (${eCounts[i]})</span>`).join("");
new Chart(document.getElementById("c2"),{type:"doughnut",data:{labels:estados,datasets:[{data:eCounts,backgroundColor:eColors,borderWidth:0,hoverOffset:4}]},options:{responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{display:false}}}});

const cats=[...new Set(events.map(e=>e.cat))];
const sorted=cats.map(c=>({c,n:events.filter(e=>e.cat===c).length})).sort((a,b)=>b.n-a.n);
document.getElementById("c3").parentElement.style.height=(sorted.length*38+60)+"px";
new Chart(document.getElementById("c3"),{type:"bar",data:{labels:sorted.map(s=>s.c),datasets:[{data:sorted.map(s=>s.n),backgroundColor:"#378ADD",borderRadius:3,borderSkipped:false}]},options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:"rgba(136,135,128,0.15)"},ticks:{stepSize:1,font:{size:10},color:"#888780"}},y:{grid:{display:false},ticks:{font:{size:10},color:"#888780"}}}}});

const deps=[...new Set(events.map(e=>e.dep))];
const dsorted=deps.map(d=>({d,v:events.filter(e=>e.dep===d).reduce((s,ev)=>s+ev.inv,0)})).sort((a,b)=>b.v-a.v);
document.getElementById("c4").parentElement.style.height=(dsorted.length*40+60)+"px";
new Chart(document.getElementById("c4"),{type:"bar",data:{labels:dsorted.map(s=>s.d),datasets:[{data:dsorted.map(s=>s.v),backgroundColor:"#EF9F27",borderRadius:3,borderSkipped:false}]},options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:"rgba(136,135,128,0.15)"},ticks:{font:{size:10},color:"#888780",callback:v=>"$"+v.toLocaleString()}},y:{grid:{display:false},ticks:{font:{size:10},color:"#888780"}}}}});

let activeQ="Todos",activeE="Todos";
const allEst=["Todos","Completado","En progreso","Pendiente","Por Aprobar","No participamos"];
const allQ=["Todos","Q1","Q2","Q3","Q4"];

function pillCls(est){return {Completado:"p-comp","En progreso":"p-prog",Pendiente:"p-pend","Por Aprobar":"p-apr","No participamos":"p-no"}[est]||"p-no";}
function pillLbl(est){return {Completado:"✓ completado","En progreso":"↗ en progreso",Pendiente:"— pendiente","Por Aprobar":"★ por aprobar","No participamos":"✗ no participa"}[est]||est;}

function renderFilters(){
  document.getElementById("filters").innerHTML=
    "<span style='font-size:11px;color:#5f5e5a;'>Quarter:</span>"+
    allQ.map(q=>`<button class="fbtn ${activeQ===q?'on':''}" onclick="setQ('${q}')">${q}</button>`).join("")+
    "<span style='font-size:11px;color:#5f5e5a;margin-left:8px;'>Estado:</span>"+
    allEst.map(e=>`<button class="fbtn ${activeE===e?'on':''}" onclick="setE('${encodeURIComponent(e)}')">${e}</button>`).join("");
}

function renderTable(){
  let rows=events;
  if(activeQ!=="Todos") rows=rows.filter(r=>r.q===activeQ);
  if(activeE!=="Todos") rows=rows.filter(r=>r.est===activeE);
  document.getElementById("tbody").innerHTML=rows.map(r=>`
    <tr>
      <td>${r.q}</td>
      <td>${r.fecha}</td>
      <td title="${r.ev}">${r.ev}</td>
      <td title="${r.cat}">${r.cat}</td>
      <td>${r.inv>0?"$"+r.inv.toLocaleString():"—"}</td>
      <td title="${r.dep}">${r.dep}</td>
      <td><span class="pill ${pillCls(r.est)}">${pillLbl(r.est)}</span></td>
    </tr>
  `).join("");
}

window.setQ=q=>{activeQ=q;renderFilters();renderTable();};
window.setE=e=>{activeE=decodeURIComponent(e);renderFilters();renderTable();};
renderFilters();
renderTable();
</script>
</body>
</html>
